  <text x="212" y="200" text-anchor="end" class="t-small t-muted">switch, wake-from-sleep</text>
  <path d="M400 230 H303" class="case"/><path d="M400 230 H303" class="w-purple"/>
  <circle cx="290" cy="230" r="13" class="sym"/>
  <path d="M283 224 V236 M290 221 V239 M297 224 V236" class="sym" style="stroke-width:1.2"/>
  <text x="309" y="222" class="t-small">+</text>
  <path d="M277 230 H228 V237" class="case"/><path d="M277 230 H228 V237" class="w-black"/>
  <path d="M219 237 H237 M222.5 241 H233.5 M226 245 H230" class="sym"/>
  <text x="212" y="226" text-anchor="end" class="t-title">Piezo buzzer</text>
  <text x="212" y="240" text-anchor="end" class="t-small t-muted">passive, PWM driven</text>
  <path d="M400 270 H318" class="case"/><path d="M400 270 H318" class="w-orange"/>
  <path d="M318 260 V280 L298 270 Z" class="sym" style="fill:#fbfcfa"/>
  <path d="M298 260 V280" class="sym"/>
  <path d="M305 257 L313 249 M310 250 L313 249 L312 252 M312 260 L320 252 M317 253 L320 252 L319 255" class="sym" style="stroke-width:1.2"/>
  <path d="M298 270 H228 V277" class="case"/><path d="M298 270 H228 V277" class="w-black"/>
  <path d="M219 277 H237 M222.5 281 H233.5 M226 285 H230" class="sym"/>
  <text x="212" y="266" text-anchor="end" class="t-title">Arcade button</text>
  <text x="212" y="280" text-anchor="end" class="t-small t-muted">built-in LED (5 V type)</text>
  <path d="M248 172 H244 V286 H248" class="sym dash" style="stroke:#7b8780;stroke-width:1.2"/>
  <path d="M400 310 H40 V60 H640 V135 H690" class="case"/><path d="M400 310 H40 V60 H640 V135 H690" class="w-blue"/>
  <path d="M400 350 H28 V45 H655 V115 H690" class="case"/><path d="M400 350 H28 V45 H655 V115 H690" class="w-yellow"/>
  <path d="M544 190 H690" class="case"/><path d="M544 190 H690" class="w-black"/>
  <path d="M544 230 H690" class="case"/><path d="M544 230 H690" class="w-red"/>
  <path d="M544 270 H690" class="case"/><path d="M544 270 H690" class="w-green"/>
  <path d="M544 310 H690" class="case"/><path d="M544 310 H690" class="w-grey"/>
  <path d="M544 350 H690" class="case"/><path d="M544 350 H690" class="w-brown"/>
  <rect x="690" y="95" width="180" height="340" rx="5" class="box"/>
  <text x="780" y="80" text-anchor="middle" class="t-title">OLED + encoder module</text>
  <rect x="784" y="108" width="76" height="58" rx="2" class="sym" style="fill:#1c2420"/>
  <text x="822" y="134" text-anchor="middle" class="t-small" style="fill:#fbfcfa">SH1106 1.3″</text>
  <text x="822" y="148" text-anchor="middle" class="t-small" style="fill:#fbfcfa">128×64</text>
  <circle cx="824" cy="290" r="26" class="sym"/><circle cx="824" cy="290" r="19" class="sym" style="stroke-width:1"/>
  <path d="M824 271 V281" class="sym"/>
  <text x="824" y="332" text-anchor="middle" class="t-small t-muted">EC11 knob</text>
  <circle cx="690" cy="115" r="3" class="pin"/><text x="698" y="119" class="t-small">SCL</text>
  <circle cx="690" cy="135" r="3" class="pin"/><text x="698" y="139" class="t-small">SDA</text><text x="726" y="139" class="t-small t-muted">I²C 0x3C</text>
  <circle cx="690" cy="190" r="3" class="pin"/><text x="698" y="194" class="t-small">GND</text>
  <circle cx="690" cy="230" r="3" class="pin"/><text x="698" y="234" class="t-small">VCC</text><text x="726" y="234" class="t-small t-muted">3.3 V only</text>
  <circle cx="690" cy="270" r="3" class="pin"/><text x="698" y="274" class="t-small">TRA</text><text x="726" y="274" class="t-small t-muted">encoder A</text>
  <circle cx="690" cy="310" r="3" class="pin"/><text x="698" y="314" class="t-small">PSH</text><text x="726" y="314" class="t-small t-muted">encoder push</text>
  <circle cx="690" cy="350" r="3" class="pin"/><text x="698" y="354" class="t-small">TRB</text><text x="726" y="354" class="t-small t-muted">encoder B</text>
  <circle cx="690" cy="390" r="3" class="pin" style="fill:#7b8780"/><text x="698" y="394" class="t-small t-muted">BAK</text><text x="726" y="394" class="t-small t-muted">BACK · not used</text>
  <circle cx="690" cy="412" r="3" class="pin" style="fill:#7b8780"/><text x="698" y="416" class="t-small t-muted">CON</text><text x="726" y="416" class="t-small t-muted">CONFIRM · not used</text>
  <text x="680" y="462" class="t-small t-muted">Header, left to right as printed</text>
  <rect x="680" y="470" width="12" height="12" rx="2" style="fill:#fbfcfa;stroke:#7b8780;stroke-width:1.2;stroke-dasharray:2 2"/><text x="686" y="496" text-anchor="middle" class="t-small" style="font-size:8px">CON</text>
  <rect x="701" y="470" width="12" height="12" rx="2" style="fill:#2563c9;stroke:#2a302c;stroke-width:1.5"/><text x="707" y="496" text-anchor="middle" class="t-small" style="font-size:8px">SDA</text>
  <rect x="722" y="470" width="12" height="12" rx="2" style="fill:#f5c400;stroke:#2a302c;stroke-width:1.5"/><text x="728" y="496" text-anchor="middle" class="t-small" style="font-size:8px">SCL</text>
  <rect x="743" y="470" width="12" height="12" rx="2" style="fill:#8d9490;stroke:#2a302c;stroke-width:1.5"/><text x="749" y="496" text-anchor="middle" class="t-small" style="font-size:8px">PSH</text>
  <rect x="764" y="470" width="12" height="12" rx="2" style="fill:#2e9e44;stroke:#2a302c;stroke-width:1.5"/><text x="770" y="496" text-anchor="middle" class="t-small" style="font-size:8px">TRA</text>
  <rect x="785" y="470" width="12" height="12" rx="2" style="fill:#7a4a22;stroke:#2a302c;stroke-width:1.5"/><text x="791" y="496" text-anchor="middle" class="t-small" style="font-size:8px">TRB</text>
  <rect x="806" y="470" width="12" height="12" rx="2" style="fill:#fbfcfa;stroke:#7b8780;stroke-width:1.2;stroke-dasharray:2 2"/><text x="812" y="496" text-anchor="middle" class="t-small" style="font-size:8px">BAK</text>
  <rect x="827" y="470" width="12" height="12" rx="2" style="fill:#141414;stroke:#2a302c;stroke-width:1.5"/><text x="833" y="496" text-anchor="middle" class="t-small" style="font-size:8px">GND</text>
  <rect x="848" y="470" width="12" height="12" rx="2" style="fill:#d42a1e;stroke:#2a302c;stroke-width:1.5"/><text x="854" y="496" text-anchor="middle" class="t-small" style="font-size:8px">VCC</text>
  <text x="458" y="432" text-anchor="end" class="t-small" style="fill:#b93d27">BAT+</text>
  <text x="512" y="432" class="t-small" style="fill:#4f5c55">BAT−</text>
  <text x="512" y="445" class="t-small t-muted">pads on underside</text>
  <path d="M330 522 V500 H397" class="case"/><path d="M330 522 V500 H397" class="w-red"/>
  <path d="M314 522 H346" class="sym"/>
  <path d="M322 531 H338" class="sym" style="stroke-width:3.5"/>
  <path d="M330 531 V560 H500 V415" class="case"/><path d="M330 531 V560 H500 V415" class="w-black"/>
  <text x="350" y="518" class="t-small" style="fill:#b93d27">+</text>
  <text x="304" y="524" text-anchor="end" class="t-title">LiPo</text>
  <text x="304" y="538" text-anchor="end" class="t-small t-muted">3.7 V cell</text>
  <circle cx="400" cy="500" r="3" class="sym"/><circle cx="440" cy="500" r="3" class="sym"/>
  <path d="M402 498 L436 484" class="sym"/>
  <text x="420" y="526" text-anchor="middle" class="t-title">Power switch</text>
  <text x="420" y="540" text-anchor="middle" class="t-small t-muted">hard off</text>
  <path d="M443 500 H470 V415" class="case"/><path d="M443 500 H470 V415" class="w-red"/>
  <text x="560" y="528" class="t-small t-muted">Charged by the XIAO's on-board</text>
  <text x="560" y="542" class="t-small t-muted">charger, through its USB-C.</text>
  <text x="560" y="564" class="t-small t-muted">Switch off: fully off, and the</text>
  <text x="560" y="578" class="t-small t-muted">battery does not charge.</text>
  <text x="560" y="600" class="t-small t-muted">BAT− is the same net as GND.</text>
</svg>
