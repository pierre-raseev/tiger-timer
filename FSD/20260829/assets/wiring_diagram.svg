<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="890" height="620" viewBox="0 0 890 620" role="img" aria-label="Schematic of the Tiger Timer: XIAO ESP32C6 connected to arcade button, piezo buzzer, a combined OLED and rotary encoder module, and a LiPo battery on the BAT pads through a power switch">
<style>
text{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;fill:#1c2420;font-size:11px}
.t-muted{fill:#7b8780} .t-title{font-weight:600;font-size:12px} .t-small{font-size:9.5px}
.box{fill:#fbfcfa;stroke:#1c2420;stroke-width:1.5} .mcu{fill:#f2f4f1;stroke:#1c2420;stroke-width:1.8}
.sym{stroke:#1c2420;stroke-width:1.8;fill:none} .dash{stroke-dasharray:5 4} .pin{fill:#1c2420}
.case{stroke:#2a302c;stroke-width:4.8;fill:none;stroke-linecap:round} .w-red{stroke:#d42a1e;stroke-width:2.6;fill:none;stroke-linecap:round} .w-black{stroke:#141414;stroke-width:2.6;fill:none;stroke-linecap:round} .w-white{stroke:#ffffff;stroke-width:2.6;fill:none;stroke-linecap:round} .w-purple{stroke:#8a3fc0;stroke-width:2.6;fill:none;stroke-linecap:round} .w-orange{stroke:#f07c14;stroke-width:2.6;fill:none;stroke-linecap:round} .w-blue{stroke:#2563c9;stroke-width:2.6;fill:none;stroke-linecap:round} .w-yellow{stroke:#f5c400;stroke-width:2.6;fill:none;stroke-linecap:round} .w-green{stroke:#2e9e44;stroke-width:2.6;fill:none;stroke-linecap:round} .w-grey{stroke:#8d9490;stroke-width:2.6;fill:none;stroke-linecap:round} .w-brown{stroke:#7a4a22;stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect width="890" height="620" fill="#fbfcfa"/>
  <rect x="455" y="96" width="34" height="12" rx="2" class="box"/>
  <text x="472" y="90" text-anchor="middle" class="t-small t-muted">USB-C · flash + charge</text>
  <rect x="400" y="108" width="144" height="302" rx="6" class="mcu"/>
  <text x="472" y="129" text-anchor="middle" class="t-title">XIAO ESP32C6</text>
  <circle cx="400" cy="150" r="3" class="pin"/><text x="410" y="154" class="t-muted">D0</text>
  <circle cx="400" cy="190" r="3" class="pin"/><text x="410" y="194">D1</text>
  <circle cx="400" cy="230" r="3" class="pin"/><text x="410" y="234">D2</text>
  <circle cx="400" cy="270" r="3" class="pin"/><text x="410" y="274">D3</text>
  <circle cx="400" cy="310" r="3" class="pin"/><text x="410" y="314">D4·SDA</text>
  <circle cx="400" cy="350" r="3" class="pin"/><text x="410" y="354">D5·SCL</text>
  <circle cx="400" cy="390" r="3" class="pin"/><text x="410" y="394" class="t-muted">D6</text>
  <circle cx="544" cy="150" r="3" class="pin"/><text x="534" y="154" text-anchor="end" class="t-muted">5V</text>
  <circle cx="544" cy="190" r="3" class="pin"/><text x="534" y="194" text-anchor="end">GND</text>
  <circle cx="544" cy="230" r="3" class="pin"/><text x="534" y="234" text-anchor="end">3V3</text>
  <circle cx="544" cy="270" r="3" class="pin"/><text x="534" y="274" text-anchor="end">D10</text>
  <circle cx="544" cy="310" r="3" class="pin"/><text x="534" y="314" text-anchor="end">D9</text>
  <circle cx="544" cy="350" r="3" class="pin"/><text x="534" y="354" text-anchor="end">D8</text>
  <circle cx="544" cy="390" r="3" class="pin"/><text x="534" y="394" text-anchor="end" class="t-muted">D7</text>
  <text x="560" y="146" class="t-small t-muted">not used</text>
